name: Update flake lock

on:
  schedule:
    - cron: "15 23 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-flake-lock
  cancel-in-progress: false

jobs:
  update:
    name: Update all flake inputs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: master
          persist-credentials: false

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: Update all flake inputs
        id: update
        run: |
          nix flake update
          if git diff --quiet -- flake.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Issue the write token only after the untrusted dependency update has finished.
      - name: Create GitHub App token
        if: steps.update.outputs.changed == 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.FLAKE_UPDATER_CLIENT_ID }}
          private-key: ${{ secrets.FLAKE_UPDATER_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Commit updated lock to master
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg head "$(git rev-parse HEAD)" \
            --rawfile lock flake.lock \
            '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { url } } }",
              variables: {
                input: {
                  branch: { repositoryNameWithOwner: $repository, branchName: "master" },
                  expectedHeadOid: $head,
                  message: { headline: "🔧 deps: flake.lockを更新" },
                  fileChanges: { additions: [{ path: "flake.lock", contents: ($lock | @base64) }] }
                }
              }
            }' | gh api graphql --input - --jq '.data.createCommitOnBranch.commit.url'
