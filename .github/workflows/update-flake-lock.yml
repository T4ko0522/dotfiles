name: Update flake lock

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-flake-lock
  cancel-in-progress: false

jobs:
  update:
    name: Update all flake inputs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: Update all flake inputs
        run: nix flake update

      # Issue the write token only after the untrusted dependency update has finished.
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.FLAKE_UPDATER_CLIENT_ID }}
          private-key: ${{ secrets.FLAKE_UPDATER_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create update pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          add-paths: flake.lock
          branch: automation/update-flake-lock
          base: master
          delete-branch: true
          sign-commits: true
          commit-message: "chore(deps): flake.lockを更新"
          title: "chore(deps): flake.lockを更新"
          body: |
            `nix flake update`による日次の全flake input更新です。

            PR CIでlaptop、desktop、wslをbuildし、手動でmergeします。
