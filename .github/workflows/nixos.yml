name: NixOS

on:
  workflow_call:
    inputs:
      build_physical:
        description: "laptopとdesktopを同一runnerでbuildする"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  contracts:
    name: Profile contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: Check profile contracts
        run: bash scripts/ci/check-profiles.sh

  physical:
    name: Build physical hosts
    if: ${{ inputs.build_physical }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: Build laptop
        run: nix build --no-link .#nixosConfigurations.laptop.config.system.build.toplevel

      - name: Build desktop
        if: ${{ !cancelled() }}
        run: nix build --no-link .#nixosConfigurations.desktop.config.system.build.toplevel

  wsl:
    name: Build WSL
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: Build configuration
        run: nix build .#nixosConfigurations.wsl.config.system.build.toplevel
