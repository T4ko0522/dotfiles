name: NixOS

on:
  workflow_call:
    inputs:
      build_physical:
        description: "laptopとdesktopを同一runnerでbuildする"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  contracts:
    name: Profile contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check profile contracts
        run: bash scripts/check_profiles.sh

  physical:
    name: Build physical hosts
    if: ${{ inputs.build_physical }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build laptop
        run: nix build --no-link .#nixosConfigurations.laptop.config.system.build.toplevel

      - name: Build desktop
        if: ${{ !cancelled() }}
        run: nix build --no-link .#nixosConfigurations.desktop.config.system.build.toplevel

  build-virtual:
    name: Build ${{ matrix.host }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host:
          - wsl
          - nixos-ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build configuration
        run: nix build .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel
