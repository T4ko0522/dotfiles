# T4ko0522/cf-edgeNix の binary cache へ NixOS closure を publish する。
#
# 本 workflow は cf-edgeNix の scripts/publish.sh を再利用するため、
# このリポジトリ (flake source) と cf-edgeNix を別 path で checkout して走らせる。
# 元テンプレート: T4ko0522/cf-edgeNix:docs/templates/publish-cache.yml
#
# ── 事前準備 (Settings → Environments → production に登録) ─────────────────
#   Secrets:
#     CACHE_PRIVATE_KEY     NAR 署名用秘密鍵
#     ADMIN_TOKEN           cf-edgeNix Worker の write API Bearer
#     CLOUDFLARE_API_TOKEN  R2 write + KV write の最小権限トークン
#   Variables:
#     CLOUDFLARE_ACCOUNT_ID
#     API_BASE_URL          deploy 済み cf-edgeNix Worker の URL
#     R2_BUCKET_NAME        例: cf-edgenix-nar
#     KV_NAMESPACE_ID

name: publish-cache

on:
  workflow_dispatch:
    inputs:
      host:
        description: "対象 host を 1 つだけ指定したい場合 (空なら matrix の全 host)"
        required: false
        type: string
  push:
    branches: [master]

concurrency:
  group: publish-cache-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production
    strategy:
      fail-fast: false
      matrix:
        # nixos-ci は CI 検証用なので publish 対象外、default は laptop の alias なので除外。
        host: [laptop, desktop]

    steps:
      - name: Checkout dotfiles (flake source)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Checkout cf-edgeNix (publish tooling)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: T4ko0522/cf-edgeNix
          ref: main
          path: .cf-edgenix

      - name: Skip host if input given and not matched
        id: gate
        env:
          REQUESTED: ${{ inputs.host }}
          CURRENT: ${{ matrix.host }}
        run: |
          if [ -n "$REQUESTED" ] && [ "$REQUESTED" != "$CURRENT" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # flake.nix の nixConfig.extra-substituters は trusted-user 制約で runner では効かないため、
      # ここで明示的に substituter / trusted-public-keys を inject する。
      # cache.numtide.com に llm-agents.nix の build artifact がある (毎回ソースから build するのを回避)。
      - name: Install Nix
        if: steps.gate.outputs.skip == 'false'
        uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72 # v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            substituters = https://cache.nixos.org https://cache.numtide.com
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=
            accept-flake-config = true

      # /nix/store を host ごとにキャッシュ。flake.lock 変化時は同 host の最新を base に取り直す。
      - name: Cache /nix/store
        if: steps.gate.outputs.skip == 'false'
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ matrix.host }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ matrix.host }}-
          gc-max-store-size-linux: 5G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-${{ matrix.host }}-
          purge-created: 0
          purge-primary-key: never

      - name: Setup Bun
        if: steps.gate.outputs.skip == 'false'
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: "1.3.14"

      - name: Cache Bun install
        if: steps.gate.outputs.skip == 'false'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('.cf-edgenix/bun.lock', '.cf-edgenix/bun.lockb', '.cf-edgenix/package.json') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install cf-edgeNix deps
        if: steps.gate.outputs.skip == 'false'
        working-directory: .cf-edgenix
        run: bun install --frozen-lockfile

      # CWD は dotfiles (flake source) のまま、scripts は .cf-edgenix/scripts/ から起動する。
      # publish.sh は CWD の flake に対して nix build を走らせるので、
      # dotfiles の nixosConfigurations.<HOST> がビルドされる。
      # closure.json は CWD に書き出され publish.ts が CWD から読む (整合)。
      - name: Build, sign & publish
        if: steps.gate.outputs.skip == 'false'
        env:
          HOST: ${{ matrix.host }}
          CACHE_DIR: ${{ runner.temp }}/cache-${{ matrix.host }}
          CACHE_PRIVATE_KEY: ${{ secrets.CACHE_PRIVATE_KEY }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          KV_NAMESPACE_ID: ${{ vars.KV_NAMESPACE_ID }}
          GIT_REV: ${{ github.sha }}
          SYSTEM: x86_64-linux
          FLAKE_LOCK_HASH: ${{ hashFiles('flake.lock') }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          mkdir -p "$CACHE_DIR"
          bash .cf-edgenix/scripts/publish.sh
