# T4ko0522/cf-edgeNix の binary cache へ NixOS closure を publish する。

name: publish-cache

on:
  workflow_call:
    inputs:
      host:
        description: "対象 host を 1 つだけ指定したい場合 (空なら matrix の全 host)"
        required: false
        type: string
  workflow_dispatch:
    inputs:
      host:
        description: "対象 host を 1 つだけ指定したい場合 (空なら matrix の全 host)"
        required: false
        type: string

concurrency:
  group: publish-cache-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production

    steps:
      - name: Checkout dotfiles (flake source)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Checkout cf-edgeNix (publish tooling)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: T4ko0522/cf-edgeNix
          ref: main
          path: .cf-edgenix

      # default は laptop の alias なので publish 対象外。
      # workflow_dispatch.inputs.host が空なら両方、指定があれば allowlist 内のもののみ。
      - name: Resolve target hosts
        id: hosts
        env:
          REQUESTED: ${{ inputs.host }}
        run: |
          if [ -z "$REQUESTED" ]; then
            echo "list=laptop desktop" >> "$GITHUB_OUTPUT"
          else
            case "$REQUESTED" in
              laptop|desktop)
                echo "list=$REQUESTED" >> "$GITHUB_OUTPUT"
                ;;
              *)
                echo "unknown host: $REQUESTED" >&2
                exit 1
                ;;
            esac
          fi

      # 自前 cache を優先し、前回 publish 済みの store path を再利用する。
      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      # 既存の /nix/store cache は復元にだけ使う。build結果は自前binary cacheへpublishされるため、
      # job後にstoreをGC・再圧縮してActions cacheへ二重保存しない。
      - name: Restore /nix/store cache
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          save: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: "1.3.14"

      - name: Cache Bun install
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('.cf-edgenix/bun.lock', '.cf-edgenix/bun.lockb', '.cf-edgenix/package.json') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install cf-edgeNix deps
        working-directory: .cf-edgenix
        run: bun install --frozen-lockfile

      # 全 host を 1 回の build / copy / upstream prune で publishする。
      # laptop と desktop の共通 closure を同じ CACHE_DIR で再利用し、二重圧縮を避ける。
      - name: Build, sign & publish
        env:
          HOSTS: ${{ steps.hosts.outputs.list }}
          CACHE_DIR: ${{ runner.temp }}/cf-edgenix-cache
          CACHE_PRIVATE_KEY: ${{ secrets.CACHE_PRIVATE_KEY }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          KV_NAMESPACE_ID: ${{ vars.KV_NAMESPACE_ID }}
          GIT_REV: ${{ github.sha }}
          SYSTEM: x86_64-linux
          FLAKE_LOCK_HASH: ${{ hashFiles('flake.lock') }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          trap 'rm -rf -- "$CACHE_DIR"' EXIT
          mkdir -p "$CACHE_DIR"
          read -r -a hosts <<< "$HOSTS"
          bash .cf-edgenix/scripts/publish.sh "${hosts[@]}"
