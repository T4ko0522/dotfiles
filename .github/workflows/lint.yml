name: Lint

on:
  workflow_call:

permissions:
  contents: read

jobs:
  syntax:
    name: Nix syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: Check Nix syntax
        run: |
          git ls-files '*.nix' \
            | xargs -r -n1 nix-instantiate --parse --quiet >/dev/null

      - name: Check binary cache configuration
        run: bash scripts/ci/check-binary-caches.sh

      - name: Test CI scripts
        run: bash scripts/ci/tests/check-publish-cooldown-test.sh

  nix-formatting:
    name: Nix formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: Check Nix formatting
        run: nix run nixpkgs#alejandra -- --check .

  lua-formatting:
    name: Lua formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: Check Lua formatting
        run: |
          git ls-files '*.lua' \
            | xargs -r nix run nixpkgs#stylua -- --check
