name: Lint

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    name: Nix syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: Check Nix syntax
        run: |
          git ls-files '*.nix' \
            | xargs -r -n1 nix-instantiate --parse --quiet >/dev/null

      - name: Check binary cache configuration
        run: bash scripts/ci/check-binary-caches.sh

  nix-formatting:
    name: Nix formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: Check Nix formatting
        run: nix run nixpkgs#alejandra -- --check .

  lua-formatting:
    name: Lua formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: Check Lua formatting
        run: |
          git ls-files '*.lua' \
            | xargs -r nix run nixpkgs#stylua -- --check

  contracts:
    name: Profile contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: Check profile contracts
        run: bash scripts/ci/check-profiles.sh

  physical:
    name: Build physical hosts
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: Build laptop
        run: nix build --no-link .#nixosConfigurations.laptop.config.system.build.toplevel

      - name: Build desktop
        if: ${{ !cancelled() }}
        run: nix build --no-link .#nixosConfigurations.desktop.config.system.build.toplevel
