name: Checks

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      nix_configs: ${{ steps.filter.outputs.nix_configs }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            nix_configs:
              - 'nix-configs/**'
              - 'flake.nix'
              - 'flake.lock'
              - 'scripts/check_profiles.sh'

  lint:
    name: Lint
    uses: ./.github/workflows/lint.yml

  chezmoi:
    name: Chezmoi
    uses: ./.github/workflows/chezmoi.yml

  nixos:
    name: NixOS
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.nix_configs == 'true'
    uses: ./.github/workflows/nixos.yml
    with:
      hosts: ${{ github.event_name == 'push' && '["wsl","nixos-ci"]' || '["laptop","desktop","wsl","nixos-ci"]' }}

  publish-cache:
    name: Publish cache
    needs: changes
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      needs.changes.outputs.nix_configs == 'true'
    uses: ./.github/workflows/publish-cache.yml
    secrets: inherit
