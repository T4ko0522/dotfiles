name: Checks

on:
  push:
    branches:
      - master
  pull_request:
    paths-ignore:
      - flake.lock
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      nix_configs: ${{ steps.filter.outputs.nix_configs }}
      physical_configs: ${{ steps.filter.outputs.physical_configs }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            nix_configs:
              - 'nix-configs/**'
              - 'flake.nix'
              - 'flake.lock'
              - 'scripts/check_profiles.sh'
            physical_configs:
              - 'flake.nix'
              - 'flake.lock'
              - 'nix-configs/assets/**'
              - 'nix-configs/lib/**'
              - 'nix-configs/pkgs/**'
              - 'nix-configs/feature/modules/**'
              - 'nix-configs/feature/profiles/base.nix'
              - 'nix-configs/feature/profiles/gaming.nix'
              - 'nix-configs/feature/profiles/vr.nix'
              - 'nix-configs/feature/profiles/workstation.nix'
              - 'nix-configs/home/modules/**'
              - 'nix-configs/home/profiles/workstation.nix'
              - 'nix-configs/hosts/laptop/**'
              - 'nix-configs/hosts/desktop/**'

  lint:
    name: Lint
    uses: ./.github/workflows/lint.yml

  chezmoi:
    name: Chezmoi
    uses: ./.github/workflows/chezmoi.yml

  nixos:
    name: NixOS
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.nix_configs == 'true'
    uses: ./.github/workflows/nixos.yml
    with:
      build_physical: ${{ github.event_name != 'push' }}

  publish-cache:
    name: Publish cache
    needs: changes
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      needs.changes.outputs.physical_configs == 'true'
    uses: ./.github/workflows/publish-cache.yml
    secrets: inherit
