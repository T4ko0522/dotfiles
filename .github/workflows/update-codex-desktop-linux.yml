name: update-codex-desktop-linux

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Nix
        uses: cachix/install-nix-action@b4b293eae0b79aac8a161bb32925a5508c9cca93 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Update codex-desktop-linux
        run: nix flake update codex-desktop-linux

      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          branch: automation/update-codex-desktop-linux
          delete-branch: true
          commit-message: "chore: update codex-desktop-linux"
          title: "chore: update codex-desktop-linux"
          body: |
            Updates the `codex-desktop-linux` flake input.

            This picks up upstream DMG hash refreshes and prevents publish-cache failures.
