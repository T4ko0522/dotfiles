log_level = "info"
log_format = "text"

# process source は sessionlog Source で代替できる (1 ターン終了検知)。
# claude.exe の子プロセス変動で誤発火するため off にする。
[sources.process]
enabled = false

[sources.sessionlog]
enabled = true

# WezTerm 監視: AskUserQuestion / ExitPlanMode 等の即時通知用。
# 1 秒間隔で `wezterm cli get-text` を呼び、選択 UI のシグネチャを検出する。
[sources.wezterm]
enabled = true
pane_id = 0
poll_interval = "1s"
