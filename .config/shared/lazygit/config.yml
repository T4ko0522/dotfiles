# https://github.com/jesseduffield/lazygit/blob/master/docs/Config.md

customCommands:
  - command: czg
    context: files
    key: c
    output: terminal
  - command: czg ai
    context: files
    key: C
    output: terminal
  - key: '<c-f>'
    description: 'Search commit messages (all branches)'
    context: 'commits'
    prompts:
      - type: 'input'
        title: 'Search pattern:'
      - type: 'menuFromCommand'
        title: 'Matching commits:'
        command: "git log --all --oneline --grep='{{index .PromptResponses 0}}'"
        filter: '(?P<hash>[a-zA-Z0-9]+) (?P<message>.*)'
        valueFormat: '{{.hash}}'
        labelFormat: '{{.hash | green}} {{.message | yellow}}'
    command: "git show {{index .PromptResponses 1}}"
    output: popup
gui:
  language: "ja"
  showIcons: true
  # Catppuccin Mocha (https://github.com/catppuccin/lazygit)
  theme:
    activeBorderColor:
      - "#a6e3a1"
      - bold
    inactiveBorderColor:
      - "#cdd6f4"
    searchingActiveBorderColor:
      - "#f9e2af"
      - bold
    optionsTextColor:
      - "#89b4fa"
    selectedLineBgColor:
      - "#313244"
    cherryPickedCommitBgColor:
      - "#94e2d5"
    cherryPickedCommitFgColor:
      - "#1e1e2e"
    unstagedChangesColor:
      - "#f38ba8"
    defaultFgColor:
      - "#cdd6f4"
  authorColors:
    "*": "#b4befe"
# log customize
git:
  branchLogCmd: "git log --graph --color=always --pretty='%Cred%h%Creset -%C(auto)%d%Creset %s %Cgreen(%cr) %C(bold blue)<%an>%Creset' {{branchName}} --"
  pagers:
    - colorArg: always
      pager: delta --dark --paging=never
  allBranchesLogCmds:
    - git log --graph --color=always --pretty='%Cred%h%Creset -%C(auto)%d%Creset %s %Cgreen(%cr) %C(bold blue)<%an>%Creset' --all
