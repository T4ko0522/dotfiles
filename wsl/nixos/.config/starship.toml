add_newline = true

# /mnt/c (Windows FS) 上でのスキャン timeout を緩和
scan_timeout = 100
command_timeout = 1000

format = """
$username\
$directory\
$git_branch\
$git_status\
$direnv\
$python\
$aws\
$fill\
$cmd_duration\
$time\
\n$character\
"""

[fill]
symbol = '─'
style = 'fg:#769ff0'

[directory]
truncation_length = 6
truncation_symbol = '.../'
truncate_to_repo = false
home_symbol = '~'
read_only = ' ro'
format = '[$path]($style)[$read_only]($read_only_style) '
style = 'bold fg:#80EBDF'
read_only_style = 'fg:#e06c75'

[git_branch]
symbol = ''
format = 'on [$symbol $branch]($style) '
style = 'fg:#89dceb'

[git_status]
format = '[$all_status$ahead_behind]($style)'
style = 'fg:#ffcb6b'

[direnv]
disabled = false
format = '[$symbol$allowed]($style) '
style = 'fg:#e0af68'

[python]
format = '[py $virtualenv]($style) '
style = 'fg:#ffcb6b'

[cmd_duration]
min_time = 1
format = '[$duration]($style)'
style = 'fg:#769ff0'

[time]
disabled = false
time_format = '%R'
format = ' [$time]($style)'
style = 'fg:#89dceb'

[username]
show_always = true
format = '[$user]($style) in '
style_user = 'bold fg:#80EBDF'
style_root = 'bold fg:#e06c75'

[character]
success_symbol = '[>>](bold fg:#80EBDF)'
error_symbol = '[>>](bold fg:#e06c75)'
vimcmd_symbol = '[<<](bold fg:#98c379)'
