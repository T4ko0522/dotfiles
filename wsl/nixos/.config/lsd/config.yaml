color:
  theme: custom

# PowerShell プロファイル側 ls の "Sat 09 May 17:43" 形式に統一
date: "+%a %d %b %H:%M"

# 列ヘッダーを表示
header: true

# 列順を PowerShell 側に合わせる (Permission / Size / User / Date / Name)
blocks:
  - permission
  - size
  - user
  - date
  - name

icons:
  when: always
  theme: fancy

sorting:
  dir-grouping: first
